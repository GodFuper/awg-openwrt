name: Build AWG for ImmortalWrt 25.12.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      SDK_BASE: https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic

    steps:
      - name: Checkout AWG sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl \
            xz-utils zstd ca-certificates

      - name: Download and verify ImmortalWrt SDK
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sdk-download"
          cd "$RUNNER_TEMP/sdk-download"

          curl -fL --retry 3 "$SDK_BASE/sha256sums" -o sha256sums

          SDK_FILE=$(
            awk '{
              name=$2
              sub(/^\*/, "", name)
              if (name ~ /^immortalwrt-sdk-25[.]12[.]2-mediatek-filogic.*Linux-x86_64[.]tar[.](zst|xz)$/)
                print name
            }' sha256sums
          )

          if [ -z "$SDK_FILE" ] || [ "$(printf '%s\n' "$SDK_FILE" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one matching SDK archive."
            printf 'Candidates: %s\n' "$SDK_FILE"
            exit 1
          fi

          curl -fL --retry 3 "$SDK_BASE/$SDK_FILE" -o "$SDK_FILE"

          awk -v file="$SDK_FILE" '{
            name=$2
            sub(/^\*/, "", name)
            if (name == file) print
          }' sha256sums > sdk.sha256

          sha256sum -c sdk.sha256

          mkdir -p "$RUNNER_TEMP/immortal-sdk"
          tar -xf "$SDK_FILE" \
            -C "$RUNNER_TEMP/immortal-sdk" \
            --strip-components=1

          echo "SDK_DIR=$RUNNER_TEMP/immortal-sdk" >> "$GITHUB_ENV"

      - name: Configure local AWG feed
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          test -f feeds.conf.default
          cp feeds.conf.default feeds.conf

          AWG_FEED="$RUNNER_TEMP/awg-feed"
          mkdir -p "$AWG_FEED"

          for package in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
            test -d "$GITHUB_WORKSPACE/$package"
            cp -a "$GITHUB_WORKSPACE/$package" "$AWG_FEED/"
          done

          printf '\nsrc-link awg %s\n' "$AWG_FEED" >> feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          ./scripts/feeds install -f -p awg kmod-amneziawg
          ./scripts/feeds install -f -p awg amneziawg-tools
          ./scripts/feeds install -f -p awg luci-proto-amneziawg

          touch .config

          for symbol in \
            ALL ALL_NONSHARED ALL_KMODS \
            PACKAGE_kmod-amneziawg \
            PACKAGE_amneziawg-tools \
            PACKAGE_luci-proto-amneziawg \
            SIGNED_PACKAGES; do
            sed -i \
              -e "/^CONFIG_${symbol}=/d" \
              -e "/^# CONFIG_${symbol} is not set$/d" \
              .config
          done

          cat >> .config <<'EOF'
          # CONFIG_ALL is not set
          # CONFIG_ALL_NONSHARED is not set
          # CONFIG_ALL_KMODS is not set
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          # CONFIG_SIGNED_PACKAGES is not set
          EOF

          make defconfig

          grep -E \
            '^CONFIG_(TARGET|PACKAGE_(kmod-amneziawg|amneziawg-tools|luci-proto-amneziawg))' \
            .config || true

          grep -q '^CONFIG_PACKAGE_kmod-amneziawg=m$' .config
          grep -q '^CONFIG_PACKAGE_amneziawg-tools=m$' .config
          grep -q '^CONFIG_PACKAGE_luci-proto-amneziawg=m$' .config

      - name: Build AWG packages
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          make -j2 V=s package/feeds/awg/kmod-amneziawg/compile
          make -j2 V=s package/feeds/awg/amneziawg-tools/compile
          make -j2 V=s package/feeds/awg/luci-proto-amneziawg/compile

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/awg-artifacts"

          find "$SDK_DIR/bin" -type f \
            \( -name 'kmod-amneziawg*.apk' \
            -o -name 'amneziawg-tools*.apk' \
            -o -name 'luci-proto-amneziawg*.apk' \
            -o -name 'luci-i18n-amneziawg-ru*.apk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/awg-artifacts/" \;

          cd "$GITHUB_WORKSPACE/awg-artifacts"
          ls kmod-amneziawg*.apk
          ls amneziawg-tools*.apk
          ls luci-proto-amneziawg*.apk
          sha256sum *.apk > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: awg-immortalwrt-25.12.2-mediatek-filogic
          path: awg-artifacts/
          if-no-files-found: error
